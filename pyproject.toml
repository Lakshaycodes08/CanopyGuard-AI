[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "canopyguard-ai"
version = "0.1.0"
description = "Vegetation risk forecasting and maintenance prioritization near power-line corridors."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.2",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "rasterio>=1.3",
  "pyproj>=3.6",
  "shapely>=2.0",
  "geopandas>=1.0",
  "pyogrio>=0.9",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1",
  "ruff>=0.16",
  "pre-commit>=4.0",
  "dvc>=3.58",
]
models = [
  "scipy>=1.14",
  "scikit-learn>=1.5",
  "lightgbm>=4.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/canopyguard"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]


[tool.ruff.lint.per-file-ignores]
"scripts/check_text_hygiene.py" = ["E402", "I001"]
"notebooks/*.ipynb" = ["E402", "E501"]
