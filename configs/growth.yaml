seed: 42

labels:
  archive: processed/labels_2013-2022_unique.npz
  # A Landsat pixel needs this many valid 10 m label cells (of up to nine).
  min_label_cells_per_pixel: 6

features:
  composites: interim/landsat/summer_composites_to_2013.npz
  recent_years: 3
  # Share of Landsat pixels in a block that must be clear for a block feature.
  min_valid_pixel_share: 0.5
  # Static site layers on the same grid, each an npz of named rasters.
  # Fire perimeters (screen only) with alarm dates between the end of the first
  # survey and the start of the last one.
  fire_perimeters: interim/fire/frap_perimeters.geojson
  fire_window_epochs: ["2013", "2022"]
  static_sources:
    - interim/terrain/terrain_features.npz
    - interim/climate/terraclimate_normals_1981-2010.npz
    - interim/vegetation/sonoma_veg_classes.npz
    - interim/vegetation/gap_landfire_ecosystems.npz

table:
  output: processed/growth_table_2013-2022.parquet
  # Landsat pixels per block edge (1 = 30 m, 3 = 90 m, 10 = 300 m).
  scales: [1, 3, 10]

validation:
  block_size_m: 2000
  folds: 10
  report_block_sizes_m: [2000, 5000, 8000]

model:
  target: mean_change
  feature_sets:
    landsat: [ndvi_, nbr_, ndmi_, blue_, green_, red_, nir_, swir1_, swir2_]
    landsat_terrain: [ndvi_, nbr_, ndmi_, blue_, green_, red_, nir_, swir1_, swir2_, elevation_m, slope_deg, northness, eastness, tpi]
    landsat_terrain_veg: [ndvi_, nbr_, ndmi_, blue_, green_, red_, nir_, swir1_, swir2_, elevation_m, slope_deg, northness, eastness, tpi, veg_, lf_]
    landsat_terrain_climate: [ndvi_, nbr_, ndmi_, blue_, green_, red_, nir_, swir1_, swir2_, elevation_m, slope_deg, northness, eastness, tpi, clim_]
    landsat_site_all: [ndvi_, nbr_, ndmi_, blue_, green_, red_, nir_, swir1_, swir2_, elevation_m, slope_deg, northness, eastness, tpi, clim_, veg_, lf_]
    landsat_terrain_eco: [ndvi_, nbr_, ndmi_, blue_, green_, red_, nir_, swir1_, swir2_, elevation_m, slope_deg, northness, eastness, tpi, eco_]
    landsat_site_eco: [ndvi_, nbr_, ndmi_, blue_, green_, red_, nir_, swir1_, swir2_, elevation_m, slope_deg, northness, eastness, tpi, clim_, eco_]
    site_only_eco: [elevation_m, slope_deg, northness, eastness, tpi, clim_, eco_]
    site_only: [elevation_m, slope_deg, northness, eastness, tpi, clim_, veg_, lf_]
  lightgbm:
    n_estimators: 400
    learning_rate: 0.03
    num_leaves: 31
    min_child_samples: 200
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    objective: l2

report:
  output: reports/growth_forecast_baseline.json

bootstrap:
  scales: [3, 10]
  block_sizes_m: [5000, 8000]
  resamples: 2000
  confidence_level: 0.95
  # MAE of the first model minus MAE of the second; negative favours the first.
  pairs:
    - [landsat, zero]
    - [landsat_terrain_eco, zero]
    - [landsat_site_eco, zero]
    - [landsat_terrain_eco, survey_height_x_eco_median]
    - [landsat_site_eco, survey_height_x_eco_median]
    - [landsat_terrain_eco, landsat]
    - [landsat_site_eco, landsat_terrain_eco]
    - [landsat_terrain_eco, site_only_eco]
    - [landsat_site_eco, lightgbm_satellite_plus_survey]
    - [landsat_terrain_eco, lightgbm_satellite_plus_survey]
    - [landsat_terrain_veg, landsat_terrain_eco]
  output: reports/growth_forecast_bootstrap.json

screens:
  all: {}
  # Rows with no fire perimeter and little LiDAR-measured loss: the steady
  # growth question. Loss share uses the label, so this is a conditional claim.
  undisturbed: {max_burned_share: 0.0, max_loss_share: 0.1}

regions:
  names: [study, west, east]
  scales: [3, 10]
  # Test rows closer than this to another region are not scored.
  buffer_m: 3000
  block_size_m: 5000
  output: reports/growth_region_transfer.json

sham_check:
  screen: undisturbed
  scale: 3
  feature_set: landsat
  output: reports/growth_sham_check.json

hazard:
  scale: 3
  # Targets for pixels disturbed after the 2013 survey. Both are labels, not
  # predictors. Fire uses the FRAP burned share; loss uses the LiDAR loss share.
  labels:
    loss: {column: loss_share, threshold: 0.3}
    burned: {column: burned, threshold: 0.5}
  feature_sets: [landsat, landsat_terrain_eco, landsat_site_eco, site_only_eco]
  k_fractions: [0.1, 0.2]
  bootstrap_resamples: 1000
  confidence_level: 0.95
  output: reports/hazard_forecast.json
