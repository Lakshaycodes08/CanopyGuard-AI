sentinel2:
  stac_url: https://stac.dataspace.copernicus.eu/v1
  collection: sentinel-2-l2a
  tile_code: MGRS-10SEH
  max_tile_cloud_percent: 20
  page_size: 100
  request_timeout_seconds: 60
  output_manifest: interim/sentinel2/mgrs-10seh/scene_manifest.json
  target_crs: EPSG:32610
  target_resolution_m: 10
  input_nodata_value: 0
  reflectance_resampling: bilinear
  categorical_resampling: nearest
  assets:
    - B02_10m
    - B03_10m
    - B04_10m
    - B08_10m
    - B05_20m
    - B06_20m
    - B07_20m
    - B8A_20m
    - B11_20m
    - B12_20m
    - SCL_20m
  scl_excluded_classes:
    - 0
    - 1
    - 2
    - 3
    - 7
    - 8
    - 9
    - 10
    - 11

cube:
  frequency: monthly
  reducer: median
  output: interim/sentinel2/mgrs-10seh/monthly_cube.zarr
  dimensions:
    - time
    - band
    - y
    - x
  reflectance_dtype: float32
  clear_count_dtype: uint16
  nodata: "NaN"
  derive_bounds_from_study_area: true
  snap_bounds_to_target_grid: true

echosat:
  # Candidate annual height maps. Coverage check only; not a validated growth
  # signal until compared with repeat airborne LiDAR.
  citation: >-
    Pauls et al. 2026, ECHOSAT: Estimating Canopy Height Over Space And Time,
    arXiv:2602.21421
  index_url: https://echosat.uni-muenster.de/
  tile_url: https://echosat.uni-muenster.de/ECHOSAT_T10S.tif
  # The files do not name the bands. Jan Pauls, corresponding author of the paper,
  # confirmed by email (October 2026) that they are one band per year in this
  # order.
  band_order_source: J. Pauls (corresponding author), personal communication, October 2026
  band_years: [2018, 2019, 2020, 2021, 2022, 2023, 2024]
  # The model predicts all years in one pass, so every band depends on imagery
  # through this year (same email).
  last_input_year: 2024
  # Benchmark only. The authors confirmed joint prediction, so every year carries
  # information from later years. Switch on only if that stops being true.
  allowed_as_feature: false
  check_years: [2018, 2019, 2020, 2021, 2022, 2023]
  nodata_value: -9999
  height_scale_to_m: 0.01
  abrupt_change_m: 5
  # Band-order check. FRAP perimeters can be incomplete or over-generalized.
  fire_check:
    perimeter_url: https://services.arcgis.com/jIL9msH9OI208GCb/ArcGIS/rest/services/California_Fire_Perimeters_1878_2019/FeatureServer/1/query
    fire_name: KINCADE
    fire_year: 2019
  request_timeout_seconds: 60
  http_max_retry: 3
  box_copy: interim/echosat/echosat_box.tif
  coverage_report: reports/echosat_coverage.json
  sample_figure: reports/figures_sample/echosat_sample.png
  figure:
    downsample: 8
    dpi: 60
    height_vmax_m: 30
    change_limit_m: 10

landsat:
  stac_url: https://planetarycomputer.microsoft.com/api/stac/v1
  collection: landsat-c2-l2
  platforms: [landsat-5, landsat-7, landsat-8]
  max_scene_cloud_percent: 60
  # Forecast cutoff is the day before the 2013 airborne survey starts
  # (configs/lidar.yaml epochs). No scene on or after it may be used.
  cutoff: "2013-09-27"
  first_year: 2001
  season_start: "06-01"
  season_end: "09-15"
  band_assets:
    blue: blue
    green: green
    red: red
    nir: nir08
    swir1: swir16
    swir2: swir22
  qa_asset: qa_pixel
  # Fill, dilated cloud, cirrus, cloud, shadow, snow (Collection 2 QA_PIXEL).
  qa_reject_mask: 63
  reflectance_scale: 0.0000275
  reflectance_offset: -0.2
  grid_crs: EPSG:32610
  grid_origin_offset_m: 15
  grid_resolution_m: 30
  workers: 8
  request_retries: 3
  output_composites: interim/landsat/summer_composites_to_2013.npz

# Terrain from satellite radar, not airborne LiDAR. SRTM X-band/C-band heights
# can sit partway into the canopy, so slope and aspect are used, not the
# elevation surface itself as a height proxy.
nasadem:
  collection: nasadem
  asset: elevation
  tpi_radius_pixels: 5
  output: interim/terrain/terrain_features.npz

terraclimate:
  collection: terraclimate
  variables: [ppt, tmax, tmin, def, aet]
  # Normals end well before the forecast cutoff in landsat.cutoff.
  normal_start: "1981-01-01"
  normal_end: "2010-12-31"
  margin_degrees: 0.2
  output: interim/climate/terraclimate_normals_1981-2010.npz

sonoma_veg:
  url: https://socogis.sonomacounty.ca.gov/map/rest/services/OWTSPublic/Sonoma_Veg_Map_Vegetation_and_Habitat/MapServer/0/query
  # Class names only. The layer also carries LiDAR height, cover and biomass
  # columns; they are airborne-survey products and must never be requested.
  fields: [MAP_CLASS, LIFEFORM, LF_FOREST, SERP_FLAG]
  page_size: 2000
  request_timeout_seconds: 120
  min_pixels_per_class: 2000
  output: interim/vegetation/sonoma_veg_classes.npz
