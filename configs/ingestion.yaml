sentinel2:
  stac_url: https://stac.dataspace.copernicus.eu/v1
  collection: sentinel-2-l2a
  tile_code: MGRS-10SEH
  max_tile_cloud_percent: 20
  page_size: 100
  request_timeout_seconds: 60
  output_manifest: interim/sentinel2/mgrs-10seh/scene_manifest.json
  target_crs: EPSG:32610
  target_resolution_m: 10
  input_nodata_value: 0
  reflectance_resampling: bilinear
  categorical_resampling: nearest
  assets:
    - B02_10m
    - B03_10m
    - B04_10m
    - B08_10m
    - B05_20m
    - B06_20m
    - B07_20m
    - B8A_20m
    - B11_20m
    - B12_20m
    - SCL_20m
  scl_excluded_classes:
    - 0
    - 1
    - 2
    - 3
    - 7
    - 8
    - 9
    - 10
    - 11

cube:
  frequency: monthly
  reducer: median
  output: interim/sentinel2/mgrs-10seh/monthly_cube.zarr
  dimensions:
    - time
    - band
    - y
    - x
  reflectance_dtype: float32
  clear_count_dtype: uint16
  nodata: "NaN"
  derive_bounds_from_study_area: true
  snap_bounds_to_target_grid: true

echosat:
  # Candidate annual height maps. Coverage check only; not a validated growth
  # signal until compared with repeat airborne LiDAR.
  citation: >-
    Pauls et al. 2026, ECHOSAT: Estimating Canopy Height Over Space And Time,
    arXiv:2602.21421
  index_url: https://echosat.uni-muenster.de/
  tile_url: https://echosat.uni-muenster.de/ECHOSAT_T10S.tif
  # The authors do not document band order. Inferred as one band per year in
  # this order; see reports/echosat_check.md for the evidence.
  band_years: [2018, 2019, 2020, 2021, 2022, 2023, 2024]
  check_years: [2018, 2019, 2020, 2021, 2022, 2023]
  nodata_value: -9999
  height_scale_to_m: 0.01
  abrupt_change_m: 5
  # Band-order check. FRAP perimeters can be incomplete or over-generalized.
  fire_check:
    perimeter_url: https://services.arcgis.com/jIL9msH9OI208GCb/ArcGIS/rest/services/California_Fire_Perimeters_1878_2019/FeatureServer/1/query
    fire_name: KINCADE
    fire_year: 2019
  request_timeout_seconds: 60
  http_max_retry: 3
  box_copy: interim/echosat/echosat_box.tif
  coverage_report: reports/echosat_coverage.json
  sample_figure: reports/figures_sample/echosat_sample.png
  figure:
    downsample: 8
    dpi: 60
    height_vmax_m: 30
    change_limit_m: 10
