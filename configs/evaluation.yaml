seed: 42

regimes:
  r1_design_based:
    method: simple_random_sample
    holdout_cells: 3000
    drawn_before_modelling: true
  r2_spatial_block:
    method: blocked
    block_size_selection: residual_variogram_practical_range
    candidate_block_sizes_m: [500, 1000, 2000, 5000]
    minimum_block_size_m: 500
    folds: 10
    assignment: systematic_dispersed
  r3_leave_one_fire_out:
    method: grouped
    group_field: mtbs_fire_id

variogram:
  target: out_of_fold_residuals
  lag_m: 100
  max_distance_m: 5000
  model: spherical
  practical_range_sill_fraction: 0.95

bootstrap:
  method: spatial_block
  resamples: 2000
  interval: bca
  confidence_level: 0.95
  paired: true
  resample_unit: block

area_of_applicability:
  enabled: true
  dissimilarity_quantile: 0.95

metrics:
  regression:
    primary: mae
    secondary: [rmse, bias, r2]
    report_by: [height_class, vegetation_class, disturbance_status, slope_band]
  ranking:
    primary: recall_at_k
    k_fractions: [0.01, 0.02, 0.10]
    secondary: [augc_at_20, precision_at_k, auc_pr, spearman, ndcg]
    report_prevalence: true
  calibration:
    diagrams: [reliability]
    scores: [ece, brier]
    conformal: [split, mondrian]
    mondrian_groups: [disturbance_status, height_decile]
    nominal_coverage: 0.90
    accepted_coverage_range: [0.85, 0.94]

baselines:
  regression:
    - global_mean
    - global_median
    - start_height_ring_isotonic
    - gada_stage1
  ranking:
    - random
    - cyclic_time_since_inspection
    - current_height_first
    - static_risk
    - span_length
    - distance_to_conductor

cost_sensitivity:
  miss_to_inspect_ratio: [10, 100, 1000, 10000]
